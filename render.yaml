services:
  - type: web
    name: skin-lesion-diagnosis
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir skin_lesion_app app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
    disk:
      name: uploads
      mountPath: /opt/render/project/src/skin_lesion_app/uploads
      sizeGB: 1
